<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>德语 B2–C1 综合练习</title>
<style>
  :root { color-scheme: light; --ink:#202633; --muted:#657084; --line:#dce2ea; --accent:#315f9d; --soft:#f3f6fa; --good:#18794e; --bad:#b54736; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f5f7fa; color:var(--ink); font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:820px; margin:32px auto; padding:0 18px 48px; }
  header, .panel { background:white; border:1px solid var(--line); border-radius:16px; padding:24px; box-shadow:0 5px 20px rgba(30,45,70,.04); }
  h1 { margin:0 0 6px; font-size:26px; }
  .sub, .muted { color:var(--muted); }
  .topline { display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; margin:20px 0 10px; }
  .pill { background:#eaf0f8; color:#315f9d; padding:4px 10px; border-radius:999px; font-size:13px; font-weight:650; }
  .progress { height:8px; background:#e7ebf1; border-radius:99px; overflow:hidden; margin:10px 0 22px; }
  .bar { height:100%; width:0; background:var(--accent); transition:width .2s; }
  .question { font-size:19px; font-weight:650; margin:14px 0; }
  .prompt { background:var(--soft); border-radius:12px; padding:16px; margin:14px 0 18px; white-space:pre-wrap; }
  .hint { color:var(--muted); font-size:14px; margin:8px 0 14px; }
  .options { display:grid; gap:10px; margin:16px 0; }
  label.option { display:flex; align-items:flex-start; gap:10px; border:1px solid var(--line); border-radius:11px; padding:12px 14px; cursor:pointer; }
  label.option:hover { border-color:#9aacc4; background:#fafcff; }
  input[type=radio] { margin-top:5px; accent-color:var(--accent); }
  input[type=text] { width:100%; padding:12px 13px; border:1px solid #cbd3df; border-radius:10px; font:inherit; margin:6px 0 10px; }
  .blankrow { margin:12px 0; }
  .blankrow label { display:block; font-weight:600; font-size:14px; }
  button { border:0; border-radius:10px; padding:11px 18px; font:600 15px system-ui; cursor:pointer; }
  button.primary { background:var(--accent); color:white; }
  button.secondary { background:#edf1f6; color:var(--ink); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .feedback { display:none; margin-top:18px; border-radius:12px; padding:15px 16px; }
  .feedback.good { display:block; background:#edf8f1; border:1px solid #b8e0c7; }
  .feedback.bad { display:block; background:#fff3f0; border:1px solid #f0c4ba; }
  .feedback strong { display:block; margin-bottom:5px; }
  .explain { margin-top:8px; }
  .summary { text-align:center; }
  .summary h2 { font-size:25px; }
  .small { font-size:13px; color:var(--muted); }
  @media(max-width:560px){ .wrap{margin:14px auto} header,.panel{padding:18px} h1{font-size:22px} .question{font-size:17px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>德语 B2–C1 综合练习</h1>
    <div class="sub">语法填空 · 选择题 · 句型转换 · 固定搭配</div>
    <p class="muted">共 10 题，一次显示一道。提交后查看答案与解释，再进入下一题。填空题请注意动词变位、语序和拼写。</p>
  </header>
  <div class="topline">
    <span class="pill" id="kind">准备开始</span>
    <span class="muted" id="counter">第 1 / 10 题</span>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <main class="panel" id="stage"></main>
</div>
<script>
const questions = [
{
 type:"填空题 · 时态与动词形式", title:"请填入三个正确的动词形式。",
 prompt:"Ich dachte zunächst, dass ich die Arbeit heute früher ________ (abschließen) könnte. Allerdings ________ (dazwischenkommen) kurzfristig mehrere Dinge, sodass mein ganzer Zeitplan völlig ________ (durcheinandergeraten).",
 hint:"注意：第一空与 könnte 搭配；第二、三空描述实际发生的事情。",
 fields:["第一空","第二空","第三空"],
 answers:[["abschließen"],["sind dazwischengekommen"],["durcheinandergeraten ist"]],
 solution:"abschließen · sind dazwischengekommen · durcheinandergeraten ist",
 explain:"第一空使用不定式 abschließen，与 könnte 构成“本来能够……”的表达。mehrere Dinge 是复数，因此使用 sind dazwischengekommen。最后描述实际发生的结果，使用 Perfekt：ist durcheinandergeraten。"
},
{
 type:"选择题 · Konjunktiv II der Vergangenheit", title:"选择最合适的动词形式。",
 prompt:"Wenn ich vorher gewusst hätte, dass sich die Sitzung so lange hinziehen würde, ________ ich etwas zu essen mitgebracht.",
 options:["A. würde","B. hätte","C. wäre","D. hatte"], correct:1,
 solution:"B. hätte",
 explain:"这是过去非现实条件句：Wenn 从句用 gewusst hätte，主句用 hätte ... mitgebracht。意思是“如果我事先知道会议会持续这么久，我本来就会带些吃的”。"
},
{
 type:"填空题 · ohne dass", title:"用 ohne dass 合并句子，并填入从句中的动词形式。",
 prompt:"Ich wollte sie nicht unterbrechen. Ich habe gewartet, bis sie mit dem Reden fertig war.\n\nIch habe gewartet, bis sie mit dem Reden fertig war, ohne dass ich sie ________ (unterbrechen).",
 hint:"使用 Perfekt；unterbrechen 的 Partizip II 是什么？",
 fields:["动词形式"],
 answers:[["unterbrochen habe"]],
 solution:"unterbrochen habe",
 explain:"ohne dass 引导从句，变位动词放在句末。Perfekt 的结构是 Partizip II + haben：ohne dass ich sie unterbrochen habe。更简洁的口语表达是：Ich habe sie ausreden lassen, ohne sie zu unterbrechen."
},
{
 type:"选择题 · obwohl 从句与时态", title:"选择语法和语义都最合适的句子。",
 prompt:"你想表达：“虽然我当时本来想向她解释一切，但最后发现根本没有必要。”",
 options:[
 "A. Obwohl ich hätte ihr alles erklären wollen, habe ich am Ende festgestellt, dass es gar nicht notwendig gewesen wäre.",
 "B. Obwohl ich ihr eigentlich alles erklären wollte, habe ich am Ende festgestellt, dass es gar nicht notwendig war.",
 "C. Obwohl ich ihr alles erklären wollen, habe ich am Ende festgestellt, dass es gar nicht notwendig ist.",
 "D. Obwohl ich ihr eigentlich alles erklären wollte, am Ende habe ich festgestellt, dass es gar nicht notwendig war."
 ], correct:1,
 solution:"B",
 explain:"obwohl 从句中的变位动词 wollte 放在句末；主句使用 habe festgestellt。最后的 war 描述过去发现的情况。"
},
{
 type:"选择题 · 比较结构", title:"选择最自然的口语表达。",
 prompt:"你原本以为事情很简单，没想到最后却变得复杂得多。哪一句最自然？",
 options:[
 "A. Am Ende ist alles so kompliziert geworden als erwartet.",
 "B. Am Ende ist alles viel komplizierter geworden als erwartet.",
 "C. Am Ende ist alles viel kompliziert geworden wie erwartet.",
 "D. Am Ende alles komplizierter geworden als gedacht ist."
 ], correct:1,
 solution:"B. Am Ende ist alles viel komplizierter geworden als erwartet.",
 explain:"比较级 komplizierter 与 als 搭配；viel 可以修饰比较级，表示“……得多”。也可以说：Am Ende war alles doch viel komplizierter als gedacht."
},
{
 type:"填空题 · 情境表达", title:"根据中文提示完成对话表达。",
 prompt:"“我本来想早点联系你，但是突然有事情插进来了。等我忙完的时候，已经很晚了。所以我决定第二天再联系你。”\n\nIch wollte mich eigentlich früher bei dir ________, aber dann ist etwas ________. Als ich endlich damit fertig war, war es schon ziemlich spät. Deshalb habe ich beschlossen, mich erst am nächsten Tag bei dir zu ________.",
 hint:"三个空都是固定表达中的动词不定式或 Partizip II。",
 fields:["第一空","第二空","第三空"],
 answers:[["melden"],["dazwischengekommen"],["melden"]],
 solution:"melden · dazwischengekommen · melden",
 explain:"sich bei jemandem melden = 联系某人；etwas ist dazwischengekommen = 突然有事情插进来；beschließen, sich zu melden = 决定联系。"
},
{
 type:"选择题 · 过去假设与现实", title:"下面两句话有什么区别？请选择正确解释。",
 prompt:"A. Ich hätte dich angerufen, wenn ich deine Nummer gehabt hätte.\nB. Ich habe dich angerufen, weil ich deine Nummer hatte.",
 options:[
 "A. 两句都表示实际打了电话，只是语气不同。",
 "B. A 是过去非现实假设，暗示当时没有号码、没有打电话；B 描述实际发生的打电话。",
 "C. A 描述未来计划；B 描述现在的习惯。",
 "D. A 表示后悔，B 表示命令。"
 ], correct:1,
 solution:"B",
 explain:"A 使用 Konjunktiv II der Vergangenheit，表达与过去事实相反的假设；B 使用 Indikativ，描述真实发生的过去事件。"
},
{
 type:"填空题 · 固定搭配与比较句", title:"填入最合适的表达。",
 prompt:"“我本来不想这么快做决定。但当时我觉得，拖得越久，事情可能就会变得越复杂。事后回想，我也不确定当时的决定是否正确。”\n\nIch wollte eigentlich nicht so schnell eine Entscheidung ________. Aber damals hatte ich das Gefühl, dass die Sache umso komplizierter werden könnte, je länger ich die Entscheidung ________ würde. Im Nachhinein bin ich mir nicht sicher, ob meine damalige Entscheidung richtig ________.",
 hint:"注意固定搭配 eine Entscheidung ...；je ... desto/umso ...；最后一空是过去时。",
 fields:["第一空","第二空","第三空"],
 answers:[["treffen"],["hinauszögern"],["war"]],
 solution:"treffen · hinauszögern · war",
 explain:"eine Entscheidung treffen = 做决定；eine Entscheidung hinauszögern = 推迟决定。je länger ...，umso komplizierter ... 表示“越……就越……”。"
},
{
 type:"选择题 · 错误辨析", title:"选择完全正确的版本。",
 prompt:"哪一句正确表达了“我现在后悔把工作拖了这么久”？",
 options:[
 "A. Jetzt bereue ich mich, dass ich die Arbeit so lange verschoben habe.",
 "B. Jetzt bereue ich, dass ich die Arbeit so lange aufgeschoben habe.",
 "C. Jetzt bereue mich, die Arbeit so lange aufgeschoben zu haben.",
 "D. Jetzt bereue ich, dass ich die Arbeit so lange aufschieben habe."
 ], correct:1,
 solution:"B. Jetzt bereue ich, dass ich die Arbeit so lange aufgeschoben habe.",
 explain:"bereuen 是及物动词，不带反身代词 mich。aufschieben 的 Partizip II 是 aufgeschoben。auf etwas verschieben 常用于把约定、会议等改期；拖延任务时 aufschieben 很自然。"
},
{
 type:"填空题 · 综合语法", title:"完成句子，注意虚拟语气与语序。",
 prompt:"“问题不在于我们不知道应该做什么，而在于我们总是一再拖延，等到自己感觉更好、准备更充分才开始。事实上，如果我早点开始，现在事情就不会这么复杂。”\n\nEs liegt nicht daran, dass wir nicht ________, was wir tun sollten, sondern daran, dass wir es immer wieder ________. Tatsächlich wäre die Sache jetzt wahrscheinlich viel weniger kompliziert, wenn ich früher ________ hätte.",
 hint:"最后一空使用 anfangen 的 Partizip II；第二空使用 aufschieben 的变位形式。",
 fields:["第一空","第二空","第三空"],
 answers:[["wissen"],["aufschieben"],["angefangen"]],
 solution:"wissen · aufschieben · angefangen",
 explain:"wissen, was wir tun sollten 是间接疑问句；es aufschieben = 拖延这件事。过去的非现实条件句：wenn ich früher angefangen hätte，主句结果可以是现在：wäre die Sache jetzt ... weniger kompliziert。"
}
];

let index=0, score=0, checked=false, answersGiven=[];
const stage=document.getElementById("stage"), bar=document.getElementById("bar"), counter=document.getElementById("counter"), kind=document.getElementById("kind");
function render(){
 checked=false;
 const q=questions[index];
 kind.textContent=q.type;
 counter.textContent=`第 ${index+1} / ${questions.length} 题 · 已答对 ${score} 题`;
 bar.style.width=`${index/questions.length*100}%`;
 let html=`<div class="question">${q.title}</div><div class="prompt">${q.prompt}</div>`;
 if(q.hint) html+=`<div class="hint">提示：${q.hint}</div>`;
 if(q.options){
   html+='<div class="options">'+q.options.map((o,i)=>`<label class="option"><input type="radio" name="choice" value="${i}"><span>${o}</span></label>`).join('')+'</div>';
 } else {
   html+=q.fields.map((f,i)=>`<div class="blankrow"><label for="a${i}">${f}</label><input type="text" id="a${i}" autocomplete="off" placeholder="填写答案"></div>`).join('');
 }
 html+=`<div class="actions"><button class="primary" id="submit">提交答案</button><button class="secondary" id="skip">暂时跳过</button></div><div id="feedback" class="feedback"></div>`;
 stage.innerHTML=html;
 document.getElementById("submit").addEventListener("click",check);
 document.getElementById("skip").addEventListener("click",()=>showFeedback(false,true));
}
function norm(s){return (s||"").trim().toLowerCase().replace(/[.,!?;:]/g,"").replace(/\s+/g," ");}
function check(){
 if(checked) return;
 const q=questions[index]; let ok=false, response="";
 if(q.options){
   const sel=document.querySelector('input[name="choice"]:checked');
   if(!sel){alert("请先选择一个答案。");return;}
   ok=Number(sel.value)===q.correct;
   response=q.options[Number(sel.value)];
 } else {
   const vals=q.fields.map((_,i)=>document.getElementById(`a${i}`).value);
   if(vals.some(v=>!v.trim())){alert("请先完成所有空格；也可以选择“暂时跳过”。");return;}
   ok=vals.every((v,i)=>q.answers[i].some(a=>norm(a)===norm(v)));
   response=vals.join(" / ");
 }
 showFeedback(ok,false,response);
}
function showFeedback(ok,skipped,response=""){
 checked=true;
 const q=questions[index]; if(ok) score++;
 answersGiven.push({ok,skipped,response});
 const fb=document.getElementById("feedback");
 fb.className=`feedback ${ok?"good":"bad"}`;
 fb.innerHTML=`<strong>${skipped?"本题已跳过":ok?"回答正确！":"再看一下正确答案。"}</strong>
 <div><b>参考答案：</b>${q.solution}</div><div class="explain">${q.explain}</div>
 <div class="actions"><button class="primary" id="next">${index===questions.length-1?"查看练习结果":"下一题"}</button></div>`;
 document.getElementById("submit").disabled=true;
 document.getElementById("skip").disabled=true;
 document.getElementById("next").addEventListener("click",next);
 counter.textContent=`第 ${index+1} / ${questions.length} 题 · 已答对 ${score} 题`;
}
function next(){
 if(index<questions.length-1){index++;render();window.scrollTo({top:0,behavior:"smooth"});}
 else finish();
}
function finish(){
 bar.style.width="100%"; kind.textContent="练习完成"; counter.textContent="10 题已完成";
 const pct=Math.round(score/questions.length*100);
 stage.innerHTML=`<div class="summary"><div class="pill">练习完成</div><h2>你的成绩：${score} / ${questions.length}</h2><p class="muted">正确率 ${pct}%</p><p>${pct>=80?"做得很好！继续巩固复杂句和固定搭配。":pct>=60?"基础结构已经掌握不少，建议重点复习错题和动词搭配。":"别着急，错题正好能帮助你发现需要巩固的语法点。再练一轮会更熟练。"} </p><button class="primary" id="restart">重新练习</button></div>`;
 document.getElementById("restart").addEventListener("click",()=>{index=0;score=0;answersGiven=[];render();window.scrollTo({top:0,behavior:"smooth"});});
}
render();
</script>
</body>
</html>
