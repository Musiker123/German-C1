<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deutsch C1 – Lückentext 16–30</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#202534;background:#f4f6fa}
*{box-sizing:border-box}
body{margin:0;padding:28px 16px;display:flex;justify-content:center}
main{width:min(760px,100%);background:white;border:1px solid #e3e7ef;border-radius:18px;padding:28px;box-shadow:0 8px 28px #18243a0d}
h1{font-size:1.45rem;margin:0 0 6px}
.sub{color:#697386;margin:0 0 22px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#566174;font-size:.92rem}
.track{height:8px;background:#e9edf4;border-radius:20px;overflow:hidden;margin:10px 0 24px}
.fill{height:100%;width:0;background:#5269bd;transition:width .2s}
.stem{font-size:1.13rem;line-height:1.8;margin:18px 0 20px}
.options{display:grid;gap:10px}
.option{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 15px;border:1px solid #dce2ec;border-radius:12px;background:#fff;font-size:1rem;cursor:pointer;color:#202534}
.option:hover:not(:disabled){border-color:#7889ca;background:#f8f9ff}
.letter{font-weight:700;color:#5269bd;min-width:22px}
.option:disabled{cursor:default;opacity:1}
.option.correct{border-color:#32966b;background:#f0faf5}
.option.wrong{border-color:#d66b6b;background:#fff5f4}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:12px;line-height:1.7;background:#f3f6fb}
.feedback.show{display:block}
.feedback.good{background:#eff9f3;border:1px solid #cdebd8}
.feedback.bad{background:#fff5f2;border:1px solid #f2d4cc}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
button.primary,button.secondary{border:0;border-radius:10px;padding:11px 18px;font-size:.98rem;cursor:pointer}
.primary{background:#5269bd;color:white}.primary:disabled{opacity:.4;cursor:not-allowed}
.secondary{background:#edf0f6;color:#344054}
.result{display:none;text-align:center;padding:26px 0}
.result h2{font-size:1.5rem}
.small{font-size:.9rem;color:#697386}
@media(max-width:520px){main{padding:20px}.stem{font-size:1.03rem}}
</style>
</head>
<body>
<main>
  <h1>Deutsch C1 – Lückentext 16–30</h1>
  <p class="sub">15 道单选题 · 每题答完后查看答案与中文解释</p>
  <section id="quiz">
    <div class="top"><span id="counter">第 16 / 30 题</span><span id="score">目前答对 0 题</span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="stem" id="stem"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="actions">
      <button class="secondary" id="restart" type="button">重新开始</button>
      <button class="primary" id="next" type="button" disabled>确认答案</button>
    </div>
  </section>
  <section class="result" id="result">
    <h2>练习完成！</h2>
    <p id="finalscore"></p>
    <p class="small">建议把答错的固定搭配和动词结构单独记下来，再复习一遍。</p>
    <button class="primary" id="again" type="button">再做一次</button>
  </section>
</main>
<script>
const questions = [{"n": 16, "stem": "Die theoretischen Annahmen, auf denen die Untersuchung basiert, sind keineswegs unumstritten und müssen daher kritisch ______ werden.", "opts": ["hinterfragt", "befragt", "angefragt", "nachgefragt"], "ans": 0, "explain": "hinterfragen = 对某种假设、观点或前提进行批判性审视。常见搭配：Annahmen kritisch hinterfragen。befragen 是询问某人；anfragen 是提出询问；nachfragen 是追问、进一步询问。"}, {"n": 17, "stem": "Die Schlussfolgerungen der Studie sind nur bedingt auf andere Kontexte ______, da die Untersuchung unter sehr spezifischen Rahmenbedingungen durchgeführt wurde.", "opts": ["übertragbar", "übertragend", "übertrieben", "übergreifend"], "ans": 0, "explain": "übertragbar sein auf + Akk. = 能够迁移／推广到……。这里讨论研究结论在其他情境中的适用性。übertragend 是动词 übertragen 的分词形式；übertrieben 是夸张的；übergreifend 是跨领域的、综合性的。"}, {"n": 18, "stem": "Die Befragten neigten dazu, ihre Erfahrungen im Nachhinein so darzustellen, dass sie mit ihren gegenwärtigen Überzeugungen möglichst gut ______.", "opts": ["übereinstimmten", "entsprachen", "übereinkamen", "zusammentrafen"], "ans": 0, "explain": "mit etwas übereinstimmen = 与……一致。这里的主语是复数 sie，过去时为 übereinstimmten。entsprechen 通常接第三格（ihren Überzeugungen entsprechen），所以不能与 mit 连用。"}, {"n": 19, "stem": "Die Ergebnisse sollten nicht isoliert betrachtet werden, sondern stets im Zusammenhang mit den sozialen und institutionellen Bedingungen, unter denen sie entstanden sind, ______ werden.", "opts": ["interpretiert", "interpretieren", "zu interpretieren", "interpretierend"], "ans": 0, "explain": "这是 werden + Partizip II 构成的被动态：Die Ergebnisse sollten ... interpretiert werden（研究结果应该被解读）。因此需要过去分词 interpretiert。"}, {"n": 20, "stem": "Die Autorin räumt ein, dass ihre Untersuchung einige Fragen offenlässt, ohne dadurch jedoch die Relevanz ihrer Ergebnisse grundsätzlich ______.", "opts": ["infrage zu stellen", "infrage gestellt", "infrage stellen", "infrage stellend"], "ans": 0, "explain": "ohne ... zu + Infinitiv 表示“而没有……”。固定表达 etwas infrage stellen = 对某事提出质疑。这里需要不定式结构 infrage zu stellen。"}, {"n": 21, "stem": "Angesichts der widersprüchlichen Aussagen lässt sich kaum beurteilen, welche Darstellung den tatsächlichen Umständen am ehesten ______.", "opts": ["entspricht", "besteht", "entsteht", "enthält"], "ans": 0, "explain": "etwas entspricht etwas（Dativ）= 某事符合／与……相符。这里 den tatsächlichen Umständen 是第三格复数。bestehen、entstehen、enthalten 在语义和搭配上都不符合句意。"}, {"n": 22, "stem": "Die Untersuchung liefert wichtige Hinweise darauf, dass institutionelle Rahmenbedingungen das professionelle Handeln von Lehrkräften maßgeblich ______.", "opts": ["beeinflussen", "beeinflusst", "beeinflusst werden", "zu beeinflussen"], "ans": 0, "explain": "从句主语是复数 die institutionellen Rahmenbedingungen，因此动词使用第三人称复数 beeinflussen。maßgeblich beeinflussen = 对……产生重大影响。"}, {"n": 23, "stem": "Die theoretische Fundierung der Arbeit ist insofern von Bedeutung, als sie dazu beiträgt, die empirischen Befunde in einen größeren wissenschaftlichen Zusammenhang ______.", "opts": ["einzuordnen", "einordnen", "eingeordnet", "einzuordnend"], "ans": 0, "explain": "beitragen zu + Dativ；当 zu 的宾语是一个动词行为时，使用 zu + Infinitiv。einordnen = 将研究发现置于更大的学术脉络中理解。可分动词 einordnen 的 zu 放在词中间：einzuordnen。"}, {"n": 24, "stem": "Die Lehrkräfte waren sich darüber einig, dass die Motivation der Studierenden nicht allein durch äußere Anreize ______ werden könne.", "opts": ["aufrechterhalten", "aufrechterhalten zu", "erhalten", "erhalten zu werden"], "ans": 0, "explain": "被动态情态结构：könne ... aufrechterhalten werden（能够被维持）。aufrechterhalten = 维持、保持；这里不能再额外加 zu。"}, {"n": 25, "stem": "Je stärker Lehrkräfte ihre eigene Rolle als bedeutsam für den Lernprozess wahrnehmen, desto eher sind sie bereit, Verantwortung für die Gestaltung einer motivierenden Lernumgebung ______.", "opts": ["zu übernehmen", "übernehmen", "übernommen", "übernehmend"], "ans": 0, "explain": "bereit sein, etwas zu tun = 愿意做某事。固定搭配 Verantwortung übernehmen = 承担责任，因此使用 zu übernehmen。"}, {"n": 26, "stem": "Die bisherigen Forschungsergebnisse legen nahe, dass die Einstellungen von Lehrkräften nicht unabhängig von den institutionellen Bedingungen betrachtet werden können, sondern in einem komplexen Wechselverhältnis zu diesen ______.", "opts": ["stehen", "liegen", "setzen", "bestehen"], "ans": 0, "explain": "in einem Wechselverhältnis zu etwas stehen = 与某事处于相互作用／相互关联的关系中。stehen 是该固定搭配中的动词。"}, {"n": 27, "stem": "Es ist davon auszugehen, dass die individuellen Erfahrungen der Lehrkräfte einen erheblichen Einfluss darauf haben, wie sie bestimmte pädagogische Situationen ______.", "opts": ["wahrnehmen", "empfinden", "bemerken", "ansehen"], "ans": 0, "explain": "wahrnehmen = 感知、理解、看待某种情境，适合表达教师如何感知教育情境。empfinden 更偏向感受；bemerken 是注意到；ansehen 通常需要更具体的句法结构。"}, {"n": 28, "stem": "Die Autorin versucht, die unterschiedlichen Perspektiven der Interviewpartner nicht vorschnell zu vereinheitlichen, sondern ihre jeweiligen Besonderheiten ______.", "opts": ["herauszuarbeiten", "auszuarbeiten", "zu erarbeiten", "aufzuarbeiten"], "ans": 0, "explain": "Besonderheiten herausarbeiten = 把各自的特点提炼出来、凸显出来。ausarbeiten 是详细拟定或完善；erarbeiten 是通过努力得出；aufarbeiten 是梳理或处理尚未解决的问题、经历等。"}, {"n": 29, "stem": "Die Ergebnisse der qualitativen Untersuchung lassen sich nicht ohne Weiteres verallgemeinern, da sie auf einer vergleichsweise kleinen und gezielt ausgewählten Stichprobe ______.", "opts": ["beruhen", "bestehen", "basieren auf", "verfügen"], "ans": 0, "explain": "auf etwas beruhen = 基于／以……为依据。句中已有介词 auf，因此正确结构是 auf einer Stichprobe beruhen。basieren 本身也常与 auf 连用，但 basieren auf 会造成介词重复；verfügen 通常搭配 über。"}, {"n": 30, "stem": "Obwohl die Interviewaussagen auf den ersten Blick widersprüchlich erscheinen, lassen sie sich bei genauerer Betrachtung durchaus miteinander ______.", "opts": ["vereinbaren", "verabreden", "vergleichen", "vermitteln"], "ans": 0, "explain": "sich mit etwas vereinbaren lassen / miteinander vereinbar sein = 能够相互协调、并不矛盾。这里表示仔细分析后，不同访谈陈述其实可以相互协调。verabreden 是约定；vergleichen 是比较；vermitteln 是调解或传达。"}];
let index=0, score=0, selected=null, checked=false;
const $=id=>document.getElementById(id);
function render(){
  selected=null; checked=false;
  const q=questions[index];
  $("counter").textContent=`第 ${q.n} / 30 题`;
  $("score").textContent=`目前答对 ${score} 题`;
  $("fill").style.width=`${index/questions.length*100}%`;
  $("stem").textContent=q.stem;
  $("options").innerHTML="";
  q.opts.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="option"; b.type="button";
    b.innerHTML=`<span class="letter">${"ABCD"[i]}.</span><span></span>`;
    b.querySelector("span:last-child").textContent=opt;
    b.addEventListener("click",()=>choose(i));
    $("options").appendChild(b);
  });
  $("feedback").className="feedback"; $("feedback").textContent="";
  $("next").textContent="确认答案"; $("next").disabled=true;
}
function choose(i){
  if(checked)return;
  selected=i;
  [...$("options").children].forEach((b,j)=>b.style.borderColor=j===i?"#7889ca":"");
  $("next").disabled=false;
}
function confirm(){
  if(!checked){
    if(selected===null)return;
    checked=true;
    const q=questions[index], correct=selected===q.ans;
    if(correct)score++;
    [...$("options").children].forEach((b,j)=>{
      b.disabled=true;
      if(j===q.ans)b.classList.add("correct");
      else if(j===selected)b.classList.add("wrong");
    });
    $("score").textContent=`目前答对 ${score} 题`;
    $("feedback").className=`feedback show ${correct?"good":"bad"}`;
    $("feedback").innerHTML=`<strong>${correct?"回答正确！":"这题答错了。正确答案是 "+ "ABCD"[q.ans]+"。"}</strong><br>${q.explain}`;
    $("next").textContent=index===questions.length-1?"查看成绩":"下一题";
  }else{
    index++;
    if(index>=questions.length){
      $("quiz").style.display="none"; $("result").style.display="block";
      $("finalscore").textContent=`你答对了 ${score} / ${questions.length} 题（${Math.round(score/questions.length*100)}%）。`;
      $("fill").style.width="100%";
    }else render();
  }
}
function restart(){
  index=0;score=0;
  $("quiz").style.display="block";$("result").style.display="none";
  render();
}
$("next").addEventListener("click",confirm);
$("restart").addEventListener("click",restart);
$("again").addEventListener("click",restart);
render();
</script>
</body>
</html>
