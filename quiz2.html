<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch C1 – Interaktiver Lückentext</title>
<style>
:root{color-scheme:light;--ink:#202631;--muted:#687386;--line:#dce2ea;--accent:#315f9f;--soft:#f3f6fa;--good:#18794e;--bad:#b42318}
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
header{margin:8px 0 22px}
h1{font-size:clamp(1.5rem,4vw,2rem);line-height:1.2;margin:0 0 8px}
.sub{color:var(--muted);margin:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,28px);box-shadow:0 8px 28px rgba(24,39,75,.06)}
.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;color:var(--muted);font-size:.92rem}
.track{height:7px;background:#e9edf3;border-radius:99px;overflow:hidden;margin-bottom:24px}
.fill{height:100%;background:var(--accent);width:0;transition:width .2s}
h2{font-size:1.1rem;margin:0 0 14px}
.question{font-size:1.12rem;line-height:1.75;margin:0 0 22px}
.options{display:grid;gap:10px}
.option{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;background:#fff}
.option:hover{border-color:#9aabc2;background:#fafcff}
.option input{margin-top:5px;accent-color:var(--accent);width:17px;height:17px;flex:0 0 auto}
.letter{font-weight:700;min-width:22px}
.option.selected{border-color:var(--accent);background:#f1f6ff}
.option.correct{border-color:var(--good);background:#effaf4}
.option.wrong{border-color:var(--bad);background:#fff4f2}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
button{border:0;border-radius:11px;padding:12px 19px;font:inherit;font-weight:650;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--accent);color:#fff}
.secondary{background:#edf1f6;color:var(--ink)}
.feedback{margin-top:20px;padding:16px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.feedback.good{background:#effaf4;border-color:#b7e1c8}
.feedback.bad{background:#fff4f2;border-color:#f0c1bc}
.feedback h3{margin:0 0 7px;font-size:1rem}
.feedback p{margin:6px 0}
.small{font-size:.92rem;color:var(--muted)}
.hidden{display:none!important}
.result{text-align:center;padding:22px 4px}
.score{font-size:2.3rem;font-weight:750;margin:8px 0}
footer{margin:16px 4px 0;color:var(--muted);font-size:.85rem;text-align:center}
@media(max-width:480px){main{padding:18px 12px 32px}.panel{border-radius:14px}.actions button{flex:1}}
</style>
</head>
<body>
<main>
<header>
<h1>Deutsch C1 – Lückentext</h1>
<p class="sub">15 道逐题练习 · 选择答案后查看解析，再进入下一题</p>
</header>
<section class="panel" id="quiz">
<div class="topline"><span id="counter">Aufgabe 1 von 15</span><span id="scoreLabel">答对 0 题</span></div>
<div class="track"><div class="fill" id="progress"></div></div>
<h2 id="taskTitle">Aufgabe 1</h2>
<p class="question" id="question"></p>
<div class="options" id="options"></div>
<div class="actions">
<button class="primary" id="checkBtn" disabled>检查答案</button>
<button class="secondary hidden" id="nextBtn">下一步</button>
</div>
<div class="feedback hidden" id="feedback" aria-live="polite"></div>
</section>
<section class="panel result hidden" id="result">
<h2>练习完成！</h2>
<div class="score" id="finalScore"></div>
<p id="finalText"></p>
<button class="primary" id="restartBtn">重新练习</button>
</section>
<footer>提示：本练习为自学材料。个别原题的选项和表达已作小幅修订，以确保答案更明确、德语表达更自然。</footer>
</main>
<script>
const questions = [
{q:"Obwohl die Regierung wiederholt versprochen hatte, die Bildungsausgaben zu erhöhen, blieb eine grundlegende Reform bislang ______.",o:["ausstehend","ausbleibend","aussetzend","abstehend"],a:0,e:"„Ausstehen“ bedeutet hier, dass etwas noch nicht erfolgt oder erledigt ist. „Eine Reform steht noch aus“ = 一项改革仍有待实施。"},
{q:"Die Wissenschaftlerin betonte, dass ihre Ergebnisse keineswegs als allgemeingültig ______ werden dürften, da die Untersuchung auf einer relativ kleinen Stichprobe beruhe.",o:["vorausgesetzt","angesehen","verallgemeinert","vernachlässigt"],a:1,e:"„Etwas als allgemeingültig ansehen“ = 将某事视为具有普遍适用性。这里的结构是 „als … angesehen werden“（被视为……）。"},
{q:"Kaum hatte der Minister seine Rede beendet, ______ heftige Kritik aus den Reihen der Opposition.",o:["erhob sich","erhob","wurde erhoben sich","hatte sich erhoben"],a:0,e:"„Sich erheben“ bedeutet hier „出现、兴起”。„Kaum …, …“ 表示“刚一……就……”，主句使用过去时：„Kaum hatte … beendet, erhob sich …“。"},
{q:"Die zunehmende Digitalisierung stellt Unternehmen vor Herausforderungen, ______ Ausmaß häufig unterschätzt wird.",o:["deren","dessen","denen","welcher"],a:0,e:"„Das Ausmaß“ 属于中性名词，但关系代词的格和数由先行词决定。先行词 „Herausforderungen“ 是复数，属格关系代词用 „deren“：这些挑战的规模。"},
{q:"Viele politische Entscheidungen werden getroffen, ohne dass die langfristigen Konsequenzen ausreichend ______ werden.",o:["berücksichtigt","in Betracht gezogen","beachtet","Alle drei Optionen sind richtig"],a:3,e:"三个表达在这里都成立：„Konsequenzen berücksichtigen“、„Konsequenzen in Betracht ziehen“、„Konsequenzen beachten“。因此 D 正确。"},
{q:"Je komplexer ein gesellschaftliches Problem ist, desto weniger lässt es sich auf eine einzige Ursache ______.",o:["zurückführen","zurückgehen","ableiten","beziehen"],a:0,e:"固定搭配 „etwas auf etwas zurückführen“ = 将某事归因于……。„sich auf eine Ursache zurückführen lassen“ = 可以归结为某个原因。"},
{q:"Die Ergebnisse der Studie sind insofern bemerkenswert, als sie bisherige Annahmen nicht nur infrage stellen, sondern diese teilweise sogar ______.",o:["widerlegen","widersprechen","bestreiten","verneinen"],a:0,e:"„Etwas widerlegen“（Akkusativ）= 反驳、证明某个观点不成立。„Widersprechen“ 则通常搭配第三格：jemandem/etwas widersprechen。"},
{q:"Es wäre verfehlt, die unterschiedlichen Positionen der Beteiligten vorschnell als unvereinbar ______.",o:["einzustufen","einzuschätzen","zu widersprechen","zu widersprechen"],a:0,e:"„Etwas als unvereinbar einstufen“ = 将某事归类/判定为不可调和的。„verfehlt“ = 不恰当的；„vorschnell“ = 过于仓促地。"},
{q:"Nicht zuletzt aufgrund der methodischen Einschränkungen sollte man die Ergebnisse mit einer gewissen Zurückhaltung ______.",o:["interpretieren","interpretiert","zu interpretieren","interpretieren worden"],a:0,e:"情态动词 „sollte“ 后接不带 „zu“ 的动词不定式：„sollte … interpretieren“。„mit Zurückhaltung“ = 谨慎地。"},
{q:"Die Autorin weist ausdrücklich darauf hin, dass ihre Argumentation nicht als Kritik an einzelnen Forschenden missverstanden werden ______.",o:["darf","soll","muss","kann"],a:1,e:"„Nicht missverstanden werden soll“ 表达作者的意图：不应被误解为……。„soll“ 在这里不是义务，而是表达希望/意图。"},
{q:"Die Frage, inwiefern individuelle Überzeugungen das professionelle Handeln beeinflussen, lässt sich nicht ohne Weiteres ______ beantworten.",o:["eindeutig","erschöpfend","pauschal","Alle drei Optionen sind richtig"],a:3,e:"三种副词都能自然修饰 „beantworten“，但意思不同：„eindeutig“ 明确地，„erschöpfend“ 详尽地，„pauschal“ 笼统地。因此 D 正确。"},
{q:"Obwohl die Maßnahme zunächst auf breite Zustimmung stieß, zeigte sich im weiteren Verlauf, dass ihre Umsetzung mit erheblichen Schwierigkeiten ______ war.",o:["verbunden","vereinbar","verfügbar","verursacht"],a:0,e:"固定搭配 „mit etwas verbunden sein“ = 伴随着……。„Die Umsetzung war mit Schwierigkeiten verbunden“ = 实施过程伴随着困难。"},
{q:"Es bedarf einer differenzierten Betrachtungsweise, um den komplexen Zusammenhängen gerecht ______.",o:["zu werden","werden","geworden zu sein","zu sein"],a:0,e:"„Es bedarf + Genitiv“ = 需要……；„etwas/jemandem gerecht werden“（Dativ）= 充分顾及、符合……。„um … gerecht zu werden“ 是目的结构。"},
{q:"Die vorliegenden Daten lassen durchaus Rückschlüsse auf die Einstellungen der Befragten ______, erlauben jedoch keine Aussagen über deren tatsächliches Verhalten.",o:["ziehen","schließen","zuziehen","erzielen"],a:0,e:"固定搭配 „Rückschlüsse auf etwas ziehen“ = 对某事作出推断。句中 „lassen … ziehen“ 是 „lassen + Infinitiv“ 结构。"},
{q:"Ungeachtet der zahlreichen Einwände hielt die Forscherin an ihrer ursprünglichen These fest, ohne zu versuchen, diese gegen jegliche Kritik zu ______.",o:["immunisieren","immunisiert","immunisierend","immunisieren zu"],a:0,e:"„Versuchen, etwas zu tun“ = 尝试做某事；„jemanden/etwas gegen Kritik immunisieren“ = 使某人/某观点不受批评影响。„ohne zu versuchen, … zu immunisieren“ 结构清晰自然。"}
];
let index=0, selected=null, locked=false, correctCount=0;
const $=id=>document.getElementById(id);
function render(){
  selected=null;locked=false;
  const item=questions[index];
  $("counter").textContent=`Aufgabe ${index+1} von ${questions.length}`;
  $("scoreLabel").textContent=`答对 ${correctCount} 题`;
  $("progress").style.width=`${index/questions.length*100}%`;
  $("taskTitle").textContent=`Aufgabe ${index+1}`;
  $("question").textContent=item.q;
  $("options").innerHTML="";
  item.o.forEach((choice,i)=>{
    const label=document.createElement("label");
    label.className="option";
    label.innerHTML=`<input type="radio" name="answer" value="${i}"><span class="letter">${"ABCD"[i]}.</span><span></span>`;
    label.querySelector("span:last-child").textContent=choice;
    label.addEventListener("click",()=>{
      if(locked)return;
      selected=i;
      document.querySelectorAll(".option").forEach(el=>el.classList.remove("selected"));
      label.classList.add("selected");
      $("checkBtn").disabled=false;
    });
    $("options").appendChild(label);
  });
  $("feedback").className="feedback hidden";
  $("feedback").textContent="";
  $("checkBtn").classList.remove("hidden");
  $("checkBtn").disabled=true;
  $("nextBtn").classList.add("hidden");
  $("nextBtn").textContent=index===questions.length-1?"查看结果":"下一步";
}
function check(){
 if(selected===null||locked)return;
 locked=true;
 const item=questions[index], good=selected===item.a;
 if(good)correctCount++;
 document.querySelectorAll(".option").forEach((el,i)=>{
   if(i===item.a)el.classList.add("correct");
   if(i===selected&&!good)el.classList.add("wrong");
 });
 $("scoreLabel").textContent=`答对 ${correctCount} 题`;
 $("feedback").className=`feedback ${good?"good":"bad"}`;
 $("feedback").innerHTML=`<h3>${good?"✓ 回答正确！":"✗ 再记住这个答案"}</h3><p><strong>正确答案：${"ABCD"[item.a]}. ${escapeHtml(item.o[item.a])}</strong></p><p>${escapeHtml(item.e)}</p>`;
 $("checkBtn").classList.add("hidden");
 $("nextBtn").classList.remove("hidden");
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function next(){
 if(index<questions.length-1){index++;render();return;}
 $("quiz").classList.add("hidden");
 $("result").classList.remove("hidden");
 $("progress").style.width="100%";
 $("finalScore").textContent=`${correctCount} / ${questions.length}`;
 $("finalText").textContent=`你答对了 ${correctCount} 道题。可以重新练习，巩固固定搭配和语法结构。`;
}
$("checkBtn").addEventListener("click",check);
$("nextBtn").addEventListener("click",next);
$("restartBtn").addEventListener("click",()=>{index=0;correctCount=0;$("result").classList.add("hidden");$("quiz").classList.remove("hidden");render();});
render();
</script>
</body>
</html>
