<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2–C1 德语动词搭配练习｜第1–18题</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#202733;background:#f5f6f8}
body{margin:0;padding:24px 14px 48px}.wrap{max-width:820px;margin:auto}
h1{font-size:1.45rem;margin:0 0 8px}.sub{color:#5e6876;margin:0 0 20px}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
button{border:0;border-radius:9px;padding:10px 15px;background:#263c58;color:white;font-size: .95rem;cursor:pointer}
button.secondary{background:#e5e9ef;color:#263342}
.card{background:white;border:1px solid #e0e4e9;border-radius:14px;padding:20px;margin:12px 0;box-shadow:0 2px 8px #1720330a}
.progress{height:8px;background:#e6eaf0;border-radius:20px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:#4e7d9e;width:0}
.meta{font-size:.88rem;color:#647184}.sentence{font-size:1.08rem;line-height:1.8;margin:14px 0}
.option{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid #dce2e9;border-radius:10px;margin:8px 0;cursor:pointer}
.option:hover{background:#f7f9fb}.option input{margin-top:4px;accent-color:#345c7e}
.option.correct{border-color:#36865a;background:#eff8f2}.option.wrong{border-color:#c45a5a;background:#fff3f2}
.feedback{padding:12px;border-radius:10px;margin-top:14px;line-height:1.65;background:#f0f3f7}
.feedback.good{background:#eff8f2}.feedback.bad{background:#fff3f2}
.hidden{display:none}.controls{display:flex;gap:9px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.score{font-weight:650}.small{font-size:.9rem;color:#5d6876}
.key{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px;margin-top:12px}
.key span{background:#f0f3f7;padding:8px;border-radius:8px;text-align:center}
</style>
</head>
<body><main class="wrap">
<h1>B2–C1 德语动词搭配练习</h1>
<p class="sub">第1–18题｜每次选择一个答案，提交后查看解释，再进入下一题。</p>
<div class="top"><div class="score" id="score">已答：0 / 18　正确：0</div><button class="secondary" id="restart">重新开始</button></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="card" id="quiz">
 <div class="meta" id="number"></div>
 <div class="sentence" id="sentence"></div>
 <div id="options"></div>
 <div class="feedback hidden" id="feedback"></div>
 <div class="controls"><button class="secondary" id="prev">上一题</button><button id="submit">检查答案</button><button id="next" class="hidden">下一题</button></div>
</section>
<section class="card hidden" id="result">
 <h2>练习完成！</h2><p id="resultText"></p><h3>答案一览</h3><div class="key" id="answerKey"></div>
 <button id="again">再做一次</button>
</section>
<p class="small">提示：题目以本轮练习中涉及的动词搭配为核心；个别干扰项为便于自测而重新编排。</p>
</main>
<script>
const questions = [
{ s:"Die Autorin kann ihre zentrale These durch mehrere empirische Beispiele ____.", o:["A. übernehmen","B. belegen","C. verfügen","D. enthalten"], a:1, e:"**eine These belegen** = 用证据支持/证明一个论点。übernehmen 是接受或接手；über etwas verfügen 是拥有/支配；enthalten 是包含。" },
{ s:"Um die Lernmotivation der Studierenden zu fördern, müssen Lehrkräfte geeignete Maßnahmen ____.", o:["A. ergreifen","B. nehmen","C. machen","D. führen"], a:0, e:"固定搭配：**Maßnahmen ergreifen**（采取措施）。也可以说 Maßnahmen durchführen，但不能说 Maßnahmen nehmen/machen。" },
{ s:"Lehrkräfte müssen sich auf die veränderten Lernbedingungen ____.", o:["A. einstellen","B. anpassen von","C. beziehen","D. verfügen"], a:0, e:"**sich auf etwas einstellen** = 为某事做好准备、适应新的情况。注意结构：sich auf + Akk. einstellen。sich an etwas anpassen 也是正确表达，但结构不同。" },
{ s:"Die Ergebnisse der Untersuchung ____ darauf hin, dass die Einstellungen der Lehrkräfte sehr unterschiedlich sind.", o:["A. weisen","B. zeigen auf","C. stellen","D. deuten"], a:0, e:"固定搭配：**auf etwas hinweisen**，常用形式是 darauf hinweisen, dass …。deuten 通常说 auf etwas hindeuten，也可以表达类似意思，但本题考查 weisen auf … hin。" },
{ s:"Bei der Planung des Unterrichts sollten Lehrkräfte die übergeordneten Lernziele nicht aus den Augen ____.", o:["A. verlieren","B. lassen","C. nehmen","D. stellen"], a:0, e:"**etwas aus den Augen verlieren** = 忽略、忘记某事。固定表达，不能按字面替换动词。" },
{ s:"Die vorliegende Untersuchung möchte die verbreitete Annahme ____ , dass Motivation ausschließlich von den Lernenden selbst abhängt.", o:["A. infrage stellen","B. zur Verfügung stellen","C. in Frage kommen","D. Anspruch nehmen"], a:0, e:"**eine Annahme infrage stellen** = 对某种假设提出质疑。注意这里是 stellen；zur Verfügung stellen 是提供。" },
{ s:"Einige Lehrkräfte ____ im Unterricht bewusst auf persönliche Beispiele zurück, um eine Verbindung zu den Lernenden herzustellen.", o:["A. greifen","B. nehmen","C. gehen","D. stellen"], a:0, e:"**auf etwas zurückgreifen** = 借助、利用某种资源或方法。句中为 greifen … auf … zurück。" },
{ s:"Die unterschiedlichen Auffassungen der Lehrkräfte ____ sich teilweise durch ihre beruflichen Erfahrungen erklären.", o:["A. lassen","B. machen","C. haben","D. bringen"], a:0, e:"**sich erklären lassen** = 可以得到解释。常见结构：Etwas lässt sich durch … erklären。" },
{ s:"Lehrkräfte sollten ihre Erwartungen an die Lernenden regelmäßig ____.", o:["A. überprüfen","B. untersuchen","C. beobachten","D. erfahren"], a:0, e:"**Erwartungen überprüfen** = 检视/重新审视自己的期待。untersuchen 更常用于研究对象；beobachten 是观察；erfahren 是获悉/经历。" },
{ s:"Die Interviews ____ einen differenzierten Einblick in die Überzeugungen der Lehrkräfte.", o:["A. erlauben","B. leisten","C. vermitteln","D. schaffen"], a:2, e:"**einen Einblick vermitteln** = 使人获得某方面的认识/洞见。注意：在其他语境中 ermöglichen/erlauben einen Einblick 也可以成立；本题按原练习设定考查 vermitteln。" },
{ s:"Die Autorin geht in ihrem Beitrag ausführlich auf die Grenzen der bisherigen Forschung ____.", o:["A. aus","B. ein","C. an","D. zurück"], a:1, e:"**auf etwas eingehen** = 详细讨论、回应某个问题。可分动词：geht … auf … ein。" },
{ s:"Die verschiedenen Perspektiven lassen sich in einen größeren theoretischen Zusammenhang ____.", o:["A. einführen","B. einnehmen","C. einordnen","D. eingehen"], a:2, e:"**etwas in einen Zusammenhang einordnen** = 将某事置于更大的背景/框架中理解。einordnen 与介词 in 搭配。" },
{ s:"Die Ergebnisse der Studie ____ die Annahme, dass alle Lernenden gleichermaßen von denselben Motivationsstrategien profitieren.", o:["A. bestätigen","B. vertreten","C. widerlegen","D. übernehmen"], a:2, e:"**eine Annahme widerlegen** = 反驳、证伪某种假设。bestätigen 则是证实，语义正好相反。" },
{ s:"Aus den Aussagen der Lehrkräfte lässt sich nicht immer unmittelbar auf ihre tatsächliche Unterrichtspraxis ____.", o:["A. schließen","B. schließen lassen","C. folgen","D. beziehen"], a:0, e:"完整结构是 **aus etwas auf etwas schließen**（从某事推断另一件事）。本句已有 lässt sich …，因此空格处填 schließen：lässt sich … schließen。" },
{ s:"Lehrkräfte müssen sich zunehmend mit den veränderten Erwartungen an ihre professionelle Rolle ____.", o:["A. auseinandersetzen","B. beschäftigen","C. beziehen","D. verhalten"], a:0, e:"**sich mit etwas auseinandersetzen** = 深入面对、探讨并处理某个问题。sich mit etwas beschäftigen 语法上也成立，但语义通常较中性，强调从事/处理某事；本题强调对角色期待进行反思性回应。" },
{ s:"Die Ergebnisse ____ die Notwendigkeit weiterer Fortbildungsangebote für Lehrkräfte.", o:["A. verdeutlichen","B. verdecken","C. verfügen","D. vertreten"], a:0, e:"**etwas verdeutlichen** = 阐明、清楚表明某事。常见搭配：die Notwendigkeit verdeutlichen。" },
{ s:"Institutionelle Rahmenbedingungen ____ den Handlungsspielraum der Lehrkräfte erheblich.", o:["A. beeinflussen","B. betreffen an","C. verfügen über","D. bestehen aus"], a:0, e:"**etwas beeinflussen** = 影响某事，直接接第四格。注意 verfügen über = 拥有；bestehen aus = 由……组成。" },
{ s:"Viele Lehrkräfte sehen sich im Berufsalltag mit der Schwierigkeit ____ , auch unter ungünstigen Bedingungen motivierend zu unterrichten.", o:["A. konfrontiert","B. betroffen","C. verbunden","D. beschäftigt"], a:0, e:"固定表达：**sich mit einer Schwierigkeit konfrontiert sehen** = 发现自己面临某种困难。结构：sich mit + Dat. konfrontiert sehen。" }
];
let current=0, answers=Array(questions.length).fill(null), checked=Array(questions.length).fill(false);
const $=id=>document.getElementById(id);
function render(){
 const q=questions[current]; $("number").textContent=`Aufgabe ${current+1} von ${questions.length}`;
 $("sentence").textContent=q.s; $("options").innerHTML="";
 q.o.forEach((opt,i)=>{const lab=document.createElement("label");lab.className="option";if(checked[current]&&i===q.a)lab.classList.add("correct");if(checked[current]&&answers[current]===i&&i!==q.a)lab.classList.add("wrong");
 const inp=document.createElement("input");inp.type="radio";inp.name="answer";inp.value=i;inp.checked=answers[current]===i;inp.disabled=checked[current];inp.addEventListener("change",()=>{answers[current]=i;});lab.append(inp,document.createTextNode(opt));$("options").append(lab);});
 const fb=$("feedback");fb.classList.toggle("hidden",!checked[current]);fb.className="feedback"+(checked[current]?(answers[current]===q.a?" good":" bad"):"");
 if(checked[current])fb.innerHTML=`<strong>${answers[current]===q.a?"Richtig!":"Leider nicht ganz."}</strong> 正确答案：${q.o[q.a]}<br>${q.e}`;
 $("submit").classList.toggle("hidden",checked[current]);$("next").classList.toggle("hidden",!checked[current]);$("prev").disabled=current===0;
 $("next").textContent=current===questions.length-1?"查看成绩":"下一题";
 const done=checked.filter(Boolean).length, right=checked.filter((v,i)=>v&&answers[i]===questions[i].a).length;
 $("score").textContent=`已答：${done} / ${questions.length}　正确：${right}`;$("bar").style.width=(done/questions.length*100)+"%";
}
$("submit").onclick=()=>{if(answers[current]===null){alert("请先选择一个答案。");return;}checked[current]=true;render();};
$("prev").onclick=()=>{if(current>0){current--;render();}};
$("next").onclick=()=>{if(current<questions.length-1){current++;render();}else showResult();};
function showResult(){$("quiz").classList.add("hidden");$("result").classList.remove("hidden");const done=checked.filter(Boolean).length,right=checked.filter((v,i)=>v&&answers[i]===questions[i].a).length;$("resultText").textContent=`你的成绩：${right} / ${questions.length}。正确率：${Math.round(right/questions.length*100)}%。`; $("answerKey").innerHTML=questions.map((q,i)=>`<span>${i+1}题：${"ABCD"[q.a]}</span>`).join("");}
function restart(){current=0;answers=Array(questions.length).fill(null);checked=Array(questions.length).fill(false);$("quiz").classList.remove("hidden");$("result").classList.add("hidden");render();}
$("restart").onclick=restart;$("again").onclick=restart;render();
</script></body></html>
