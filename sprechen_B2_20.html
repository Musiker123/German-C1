<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>德语 B2–C1 口语表达练习｜20题</title>
<style>
  :root { color-scheme: light; --ink:#20242b; --muted:#667085; --line:#e4e7ec; --accent:#315e9e; --good:#16834a; --bad:#b54708; --panel:#f7f8fa; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 14px 48px; background:#f3f5f8; color:var(--ink); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:820px; margin:0 auto; }
  header, .quiz-card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 4px 18px rgba(16,24,40,.045); }
  header { margin-bottom:16px; }
  h1 { font-size:clamp(1.35rem,4vw,1.8rem); margin:0 0 8px; }
  .sub, .muted { color:var(--muted); }
  .stats { display:flex; flex-wrap:wrap; gap:10px 18px; margin-top:14px; font-size:.92rem; }
  .progress-wrap { height:9px; background:#edf0f4; border-radius:99px; overflow:hidden; margin-top:14px; }
  .progress { height:100%; width:5%; background:var(--accent); transition:width .2s ease; }
  .topline { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:10px; color:var(--muted); font-size:.92rem; }
  .scene { font-weight:700; color:var(--accent); margin:0 0 8px; }
  .prompt { font-size:1.12rem; font-weight:650; margin:0 0 18px; }
  .options { display:grid; gap:10px; }
  .option { display:flex; align-items:flex-start; gap:12px; width:100%; padding:13px 14px; text-align:left; background:#fff; border:1px solid var(--line); border-radius:12px; color:var(--ink); cursor:pointer; font:inherit; transition:border-color .15s,background .15s; }
  .option:hover:not(:disabled) { border-color:#8ba6cf; background:#f8faff; }
  .letter { flex:0 0 28px; height:28px; display:grid; place-items:center; border-radius:8px; background:#eef2f7; font-weight:700; }
  .option.selected { border-color:var(--accent); background:#f2f6fc; }
  .option.correct { border-color:#54a879; background:#f0faf4; }
  .option.incorrect { border-color:#d98a58; background:#fff7f0; }
  .option:disabled { cursor:default; opacity:1; }
  .feedback { display:none; margin-top:18px; padding:16px; border-radius:12px; background:var(--panel); border:1px solid var(--line); }
  .feedback.show { display:block; }
  .feedback h3 { margin:0 0 8px; font-size:1.05rem; }
  .feedback p { margin:7px 0; }
  .explanation { white-space:pre-line; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  button.action { border:0; border-radius:10px; padding:11px 17px; font:inherit; font-weight:650; cursor:pointer; }
  #checkBtn, #nextBtn { background:var(--accent); color:#fff; }
  #checkBtn:disabled { opacity:.45; cursor:not-allowed; }
  #restartBtn { background:#edf0f4; color:var(--ink); }
  .hint { margin-top:12px; font-size:.9rem; color:var(--muted); }
  .finish { display:none; text-align:center; }
  .finish.show { display:block; }
  .score { font-size:2.5rem; font-weight:800; color:var(--good); margin:8px 0; }
  .review { margin-top:16px; text-align:left; }
  .review li { margin:6px 0; }
  @media (max-width:520px) { body{padding:14px 10px 32px} header,.quiz-card{padding:17px} .prompt{font-size:1.04rem} }
</style>
</head>
<body>
<main>
  <header>
    <h1>德语 B2–C1 口语表达练习</h1>
    <div class="sub">20 道情境选择题｜每次一道｜答题后查看正确答案与表达讲解</div>
    <div class="stats">
      <span id="count">第 1 / 20 题</span>
      <span id="score">答对：0</span>
      <span id="answered">已完成：0</span>
    </div>
    <div class="progress-wrap"><div class="progress" id="progress"></div></div>
  </header>

  <section class="quiz-card" id="quiz">
    <div class="topline"><span id="round">第二轮 · Aufgabe 1</span><span>请选择最自然的表达</span></div>
    <p class="scene" id="scene"></p>
    <p class="prompt" id="prompt"></p>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="actions">
      <button class="action" id="checkBtn" disabled>检查答案</button>
      <button class="action" id="nextBtn" style="display:none">下一题 →</button>
      <button class="action" id="restartBtn">重新开始</button>
    </div>
    <div class="hint" id="hint">小提示：先独立选择，再点击“检查答案”。</div>
  </section>

  <section class="quiz-card finish" id="finish">
    <h2>练习完成！</h2>
    <div class="score" id="finalScore">0 / 20</div>
    <p id="finalText"></p>
    <ol class="review" id="review"></ol>
    <div class="actions"><button class="action" id="againBtn">再做一遍</button></div>
  </section>
</main>

 round:"第三轮", n:5, scene:"Im Alltag",

 explanation:"beinahe 和 fast 都表示“差一点儿、几乎”。\n例：Ich wäre beinahe zu spät gekommen.（我差点迟到了。）\n口语中也常说：Ich habe es fast vergessen.（我差点忘了。）"

let index = 0, selected = null, locked = false, correctCount = 0, answeredCount = 0, results = [];
const $ = id => document.getElementById(id);
function render() {
  selected = null; locked = false;
  const q = questions[index];
  $("quiz").style.display = "block"; $("finish").classList.remove("show");
  $("count").textContent = `第 ${index+1} / ${questions.length} 题`;
  $("score").textContent = `答对：${correctCount}`;
  $("answered").textContent = `已完成：${answeredCount}`;
  $("progress").style.width = `${(answeredCount/questions.length)*100}%`;
  $("round").textContent = `${q.round} · Aufgabe ${q.n}`;
  $("scene").textContent = q.scene;
  $("prompt").textContent = q.prompt;
  $("options").innerHTML = "";
  q.options.forEach((opt,i) => {
    const b = document.createElement("button");
    b.className = "option"; b.type = "button";
    b.innerHTML = `<span class="letter">${"ABCD"[i]}</span><span>${escapeHtml(opt)}</span>`;
    b.addEventListener("click", () => {
      if (locked) return;
      selected = i;
      document.querySelectorAll(".option").forEach((el,j)=>el.classList.toggle("selected",j===i));
      $("checkBtn").disabled = false;
    });
    $("options").appendChild(b);
  });
  $("feedback").className = "feedback"; $("feedback").innerHTML = "";
  $("checkBtn").style.display = "inline-block"; $("checkBtn").disabled = true;
  $("nextBtn").style.display = "none";
  $("hint").textContent = "小提示：先独立选择，再点击“检查答案”。";
}
function escapeHtml(s) { return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }
function check() {
  if (selected === null || locked) return;
  locked = true;
  const q = questions[index], right = selected === q.answer, acceptable = (q.acceptable||[]).includes(selected);
  answeredCount++;
  if (right || acceptable) correctCount++;
  results.push({q, selected, right, acceptable});
  document.querySelectorAll(".option").forEach((el,i)=>{
    el.disabled = true;
    if (i === q.answer) el.classList.add("correct");
    if (i === selected && !right && !acceptable) el.classList.add("incorrect");
    if (i === selected && acceptable) el.classList.add("correct");
  });
  const heading = right ? "回答正确！" : acceptable ? "这个答案也可以！" : "再看一下正确表达";
  const sub = right ? "很好，选中了本题的目标答案。" : acceptable ? "你的答案在实际德语中也成立；本题另有一个更贴合题意的目标答案。" : `本题目标答案是 ${"ABCD"[q.answer]}。`;
  $("feedback").innerHTML = `<h3>${heading}</h3><p>${sub}</p><p><strong>重点表达：${escapeHtml(q.title)}</strong></p><p class="explanation">${escapeHtml(q.explanation)}</p>`;
  $("feedback").classList.add("show");
  $("checkBtn").style.display = "none";
  $("nextBtn").style.display = "inline-block";
  $("nextBtn").textContent = index === questions.length-1 ? "查看练习结果" : "下一题 →";
  $("score").textContent = `答对：${correctCount}`;
  $("answered").textContent = `已完成：${answeredCount}`;
  $("progress").style.width = `${(answeredCount/questions.length)*100}%`;
  $("hint").textContent = "绿色标记为本题目标答案；部分题目另有可接受的自然表达。";
}
function finish() {
  $("quiz").style.display = "none"; $("finish").classList.add("show");
  $("finalScore").textContent = `${correctCount} / ${questions.length}`;
  $("finalText").textContent = `你完成了全部 20 道题。可查看下面的答题记录，或重新开始巩固表达。`;
  $("review").innerHTML = results.map((r,i)=>{
    const status = r.right ? "✓" : r.acceptable ? "✓（可接受表达）" : `正确答案：${"ABCD"[r.q.answer]}`;
    return `<li><strong>${i+1}. ${r.q.round} Aufgabe ${r.q.n}</strong> — 你的答案 ${"ABCD"[r.selected]}；${status}<br><span class="muted">${escapeHtml(r.q.title)}</span></li>`;
  }).join("");
}
function restart() { index=0; selected=null; locked=false; correctCount=0; answeredCount=0; results=[]; render(); }
$("checkBtn").addEventListener("click",check);
$("nextBtn").addEventListener("click",()=>{ if(index<questions.length-1){index++;render();}else{finish();} });
$("restartBtn").addEventListener("click",restart);
$("againBtn").addEventListener("click",restart);
render();
</script>
</body>
</html>
